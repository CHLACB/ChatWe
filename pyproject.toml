[project]
name = "wx-ai-assistant-core"
version = "0.1.0"
description = "Local WeChat AI auto-reply core skeleton with clean architecture."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
